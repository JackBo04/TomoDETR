[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tomodetr"
version = "0.2.0"
description = "3D point-set prediction with cross-window query refinement"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy>=1.24", "scipy>=1.10", "PyYAML>=6", "mrcfile>=1.4"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tomodetr = "tomodetr.cli:main"

[tool.setuptools.packages.find]
include = ["tomodetr*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
